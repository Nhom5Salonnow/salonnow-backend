version: '3.8'

services:

  api:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=postgres_db
      - REDIS_HOST=redis_db
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_NAME=salon_db
      - JWT_SECRET=6OZ0+r/n6/G92QF7+Sx2pj4E2g+bHiGlQbKjNSrh3WE=
    depends_on:
      - postgres_db
      - redis_db

  postgres_db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: salon_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis_db:
    image: redis:alpine
    restart: always
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: